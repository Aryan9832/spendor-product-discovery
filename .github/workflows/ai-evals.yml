name: AI reliability checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-ai-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ai_service/requirements.txt
      - run: PYTHONPATH=ai_service pytest ai_service/tests
      - run: PYTHONPATH=ai_service python ai_service/evals/run_evals.py
